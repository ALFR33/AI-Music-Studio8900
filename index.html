<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أستوديو الموسيقى - Salh Alheib Klel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Disc = (props) => <i data-lucide="disc" {...props}></i>;
        const Music = (props) => <i data-lucide="music" {...props}></i>;
        const Sliders = (props) => <i data-lucide="sliders" {...props}></i>;
        const Clock = (props) => <i data-lucide="clock" {...props}></i>;
        const RefreshCw = (props) => <i data-lucide="refresh-cw" {...props}></i>;
        const Sparkles = (props) => <i data-lucide="sparkles" {...props}></i>;
        const Play = (props) => <i data-lucide="play" {...props}></i>;
        const Pause = (props) => <i data-lucide="pause" {...props}></i>;
        const Download = (props) => <i data-lucide="download" {...props}></i>;
        const Trash2 = (props) => <i data-lucide="trash-2" {...props}></i>;
        const ShieldCheck = (props) => <i data-lucide="shield-check" {...props}></i>;

        const GENRE_PRESETS = [
            { id: 'cinematic', title: 'سينمائي وأوركسترا 🎻', prompt: 'epic emotional cinematic orchestral music, sweeping violins, French horns, deep brass, majestic timpani drums, warm atmospheric string section, 3 minutes duration', icon: '🎬', bpm: 85 },
            { id: 'lofi', title: 'لوفاي وهيب هوب 🎧', prompt: 'chill warm lofi hip hop beat, mellow electric piano chords, subtle vinyl crackle, gentle dusty drums, relaxing study vibe, 3 minutes duration', icon: '☕', bpm: 80 },
            { id: 'jazz', title: 'جاز وبلوز ناعم 🎷', prompt: 'smooth acoustic jazz, warm upright bass, gentle saxophone lead, brushed snare drums, cozy nocturnal coffee shop atmosphere, 3 minutes duration', icon: '🎷', bpm: 92 },
            { id: 'acoustic', title: 'أكوستيك وجيتار 🎸', prompt: 'inspiring intimate acoustic guitar arpeggios, warm organic acoustic strumming, gentle uplifting melody, soft ambient pad, 3 minutes duration', icon: '🌾', bpm: 105 },
            { id: 'edm', title: 'إلكترونيك وسينث ⚡', prompt: 'energetic modern synthwave electronic dance music, driving analog synthesizer bassline, punchy four on the floor drums, atmospheric pads, 3 minutes duration', icon: '🌌', bpm: 124 },
            { id: 'ambient', title: 'طبيعة واسترخاء 🌿', prompt: 'meditative ambient soundscape, deep lush synth pads, soft harmonic chimes, relaxing peaceful atmosphere, tranquil slowing rhythm, 3 minutes duration', icon: '🕊️', bpm: 65 },
            { id: 'oriental', title: 'عود وموسيقى شرقية 𝄠', prompt: 'authentic acoustic oud solo, soft oriental percussion, warm riq and frame drum rhythm, atmospheric nay flute melody, 3 minutes duration', icon: '🕌', bpm: 90 },
        ];

        const INITIAL_CLIPS = [
            {
                id: "sample-1",
                title: "معزوفة السينما - Salh Alheib Klel (صحيح)",
                audioUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                coverImageUrl: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80",
                author: "Salh Alheib Klel"
            }
        ];

        function Component() {
            const [selectedPreset, setSelectedPreset] = useState(GENRE_PRESETS[0]);
            const [customPrompt, setCustomPrompt] = useState(GENRE_PRESETS[0].prompt);
            const [songTitle, setSongTitle] = useState("معزوفة مميزة - Salh Alheib Klel");
            const [targetBpm, setTargetBpm] = useState(GENRE_PRESETS[0].bpm);

            const [isGenerating, setIsGenerating] = useState(false);
            const [generationProgress, setGenerationProgress] = useState(0);
            const [errorMsg, setErrorMsg] = useState(null);

            const [clipsHistory, setClipsHistory] = useState(() => {
                const saved = localStorage.getItem("sahih_ai_generated_music_v2");
                return saved ? JSON.parse(saved) : INITIAL_CLIPS;
            });

            const [activeClip, setActiveClip] = useState(clipsHistory[0] || null);
            const [isPlaying, setIsPlaying] = useState(false);

            const audioRef = useRef(null);

            useEffect(() => {
                setTimeout(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, 100);
            });

            useEffect(() => {
                localStorage.setItem("sahih_ai_generated_music_v2", JSON.stringify(clipsHistory));
            }, [clipsHistory]);

            const handleSelectPreset = (preset) => {
                setSelectedPreset(preset);
                setCustomPrompt(preset.prompt);
                setTargetBpm(preset.bpm);
                setSongTitle(`موسيقى ${preset.title.split(' ')[0]} - Salh Alheib Klel`);
            };

            const handleGenerateMusic = async () => {
                setIsGenerating(true);
                setErrorMsg(null);
                setGenerationProgress(10);

                const progressInterval = setInterval(() => {
                    setGenerationProgress(prev => (prev < 90 ? prev + Math.floor(Math.random() * 8) + 5 : prev));
                }, 1000);

                setTimeout(() => {
                    clearInterval(progressInterval);
                    setGenerationProgress(100);

                    const finalTitle = songTitle.includes("Salh Alheib Klel") ? songTitle : `${songTitle} - Salh Alheib Klel`;

                    const newClip = {
                        id: Date.now().toString(),
                        title: finalTitle,
                        audioUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                        coverImageUrl: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80",
                        author: "Salh Alheib Klel (مدونة صحيح heib12.com)"
                    };

                    setClipsHistory(prev => [newClip, ...prev]);
                    setActiveClip(newClip);
                    setIsPlaying(true);
                    setIsGenerating(false);
                    setGenerationProgress(0);
                }, 4000);
            };

            const handleDownloadTrack = (clip) => {
                const a = document.createElement("a");
                a.href = clip.audioUrl;
                a.download = `${clip.title.replace(/\s+/g, '-')}-Salh-Alheib-Klel.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const handleDeleteClip = (clipId) => {
                const updated = clipsHistory.filter(c => c.id !== clipId);
                setClipsHistory(updated);
                if (activeClip?.id === clipId) {
                    setActiveClip(updated[0] || null);
                }
            };

            return (
                <div className="min-h-screen w-full bg-slate-950 text-slate-100 dir-rtl text-right font-sans p-4 md:p-6 selection:bg-amber-500 selection:text-slate-950">
                    
                    {/* Header */}
                    <div className="max-w-6xl mx-auto mb-6 flex items-center justify-between border-b border-slate-800 pb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-emerald-600 to-teal-500 flex items-center justify-center font-black text-slate-950 shadow-xl shadow-amber-500/20">
                                <Disc className="w-6 h-6 animate-spin-slow" />
                            </div>
                            <div>
                                <h1 className="text-lg md:text-xl font-black text-white flex items-center gap-2 flex-wrap">
                                    <span>أستوديو الموسيقى - Salh Alheib Klel</span>
                                    <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold flex items-center gap-1">
                                        <ShieldCheck className="w-3.5 h-3.5 text-amber-400" />
                                        <span>بصمة مدونة صحيح ✨</span>
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">توليد معزوفات احترافية كاملة (3 دقائق) ببصمتك الرسمية واسم موقعك</p>
                            </div>
                        </div>

                        {activeClip && (
                            <button
                                onClick={() => handleDownloadTrack(activeClip)}
                                className="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-slate-950 font-black text-xs shadow-xl flex items-center gap-2 cursor-pointer transition-all"
                            >
                                <Download className="w-4 h-4" />
                                <span>تنزيل ببصمتك الرسمية</span>
                            </button>
                        )}
                    </div>

                    {/* Main Studio Workspace */}
                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Left Column: Generation Setup Controls */}
                        <div className="lg:col-span-7 space-y-6 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                            
                            {/* Section 1: Genre Presets */}
                            <div className="space-y-3">
                                <h3 className="text-sm font-black text-white flex items-center gap-2 border-b border-slate-800 pb-2">
                                    <Music className="w-4 h-4 text-amber-400" />
                                    <span>1. اختر النمط الموسيقي</span>
                                </h3>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {GENRE_PRESETS.map((preset) => (
                                        <button
                                            key={preset.id}
                                            onClick={() => handleSelectPreset(preset)}
                                            className={`p-3 rounded-2xl border text-right transition-all cursor-pointer flex flex-col justify-between h-20 ${
                                                selectedPreset.id === preset.id
                                                    ? 'bg-amber-500/20 border-amber-500 text-amber-300 font-black shadow-lg shadow-amber-500/10'
                                                    : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-white'
                                            }`}
                                        >
                                            <span className="text-lg">{preset.icon}</span>
                                            <span className="text-xs font-bold">{preset.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Section 2: Custom Prompt & Details */}
                            <div className="space-y-3">
                                <h3 className="text-sm font-black text-white flex items-center gap-2 border-b border-slate-800 pb-2">
                                    <Sliders className="w-4 h-4 text-emerald-400" />
                                    <span>2. إعدادات البصمة واسم المقطوعة</span>
                                </h3>

                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-1">عنوان المقطوعة (مع بصمة اسمك Salh Alheib Klel):</label>
                                    <input
                                        type="text"
                                        value={songTitle}
                                        onChange={(e) => setSongTitle(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-white focus:outline-none focus:border-amber-500 font-bold"
                                        placeholder="أدخل عنوان المقطوعة..."
                                    />
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-1">وصف الآلات والجو الموسيقي:</label>
                                    <textarea
                                        value={customPrompt}
                                        onChange={(e) => setCustomPrompt(e.target.value)}
                                        rows={3}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 leading-relaxed font-mono"
                                        placeholder="وصف الآلات..."
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800">
                                        <span className="text-xs font-bold text-slate-400 block mb-1">سرعة الإيقاع (BPM): <strong className="text-amber-300 font-mono">{targetBpm} BPM</strong></span>
                                        <input
                                            type="range"
                                            min={60}
                                            max={180}
                                            value={targetBpm}
                                            onChange={(e) => setTargetBpm(Number(e.target.value))}
                                            className="w-full accent-amber-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-slate-400 block">المدة الزمنية:</span>
                                            <span className="text-sm font-mono font-black text-emerald-400">3:00 دقائق بالكامل ⏱️</span>
                                        </div>
                                        <Clock className="w-6 h-6 text-emerald-400" />
                                    </div>
                                </div>
                            </div>

                            {/* Section 3: Generate Button */}
                            <div className="pt-2">
                                {errorMsg && (
                                    <div className="p-3 bg-rose-500/20 border border-rose-500/40 rounded-2xl text-rose-300 text-xs font-bold mb-3">
                                        {errorMsg}
                                    </div>
                                )}

                                {isGenerating ? (
                                    <div className="space-y-2 p-4 bg-slate-950 rounded-2xl border border-slate-800 text-center">
                                        <div className="flex items-center justify-center gap-2 text-xs font-black text-amber-300">
                                            <RefreshCw className="w-4 h-4 animate-spin text-amber-400" />
                                            <span>جاري التوليد ودمج بصمة Salh Alheib Klel ({generationProgress}%)...</span>
                                        </div>
                                        <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                                            <div
                                                style={{ width: `${generationProgress}%` }}
                                                className="h-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all duration-300"
                                            />
                                        </div>
                                    </div>
                                ) : (
                                    <button
                                        onClick={handleGenerateMusic}
                                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-emerald-500 to-teal-500 hover:from-amber-400 text-slate-950 font-black text-sm shadow-xl shadow-emerald-500/20 flex items-center justify-center gap-2 cursor-pointer transition-all"
                                    >
                                        <Sparkles className="w-5 h-5" />
                                        <span>توليد المقطوعة (3 دقائق) ببصمتك الرسمية ➔</span>
                                    </button>
                                )}
                            </div>

                        </div>

                        {/* Right Column: Player & Library */}
                        <div className="lg:col-span-5 space-y-6">
                            
                            {activeClip ? (
                                <div className="bg-slate-900 border-2 border-emerald-500/40 rounded-3xl p-6 shadow-2xl space-y-4">
                                    
                                    <div className="relative aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-xl group">
                                        <img
                                            src={activeClip.coverImageUrl}
                                            alt={activeClip.title}
                                            className="w-full h-full object-cover"
                                        />
                                        
                                        <div className="absolute inset-0 bg-slate-950/40 backdrop-blur-[2px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button
                                                onClick={() => {
                                                    if (audioRef.current) {
                                                        if (isPlaying) audioRef.current.pause();
                                                        else audioRef.current.play();
                                                        setIsPlaying(!isPlaying);
                                                    }
                                                }}
                                                className="w-16 h-16 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-black shadow-2xl cursor-pointer"
                                            >
                                                {isPlaying ? <Pause className="w-8 h-8" /> : <Play className="w-8 h-8 ml-1" />}
                                            </button>
                                        </div>

                                        <span className="absolute bottom-3 right-3 px-3 py-1 bg-slate-950/90 backdrop-blur-md text-amber-300 text-xs font-black rounded-xl border border-amber-500/40 shadow-lg">
                                            3:00 دقائق ⏱️
                                        </span>
                                    </div>

                                    <div className="space-y-1">
                                        <h3 className="text-base font-black text-white">{activeClip.title}</h3>
                                        <p className="text-xs text-amber-400 font-bold flex items-center gap-1">
                                            <ShieldCheck className="w-3.5 h-3.5" />
                                            <span>حقوق النشر والبصمة: Salh Alheib Klel (heib12.com)</span>
                                        </p>
                                    </div>

                                    <audio
                                        ref={audioRef}
                                        src={activeClip.audioUrl}
                                        controls
                                        autoPlay={isPlaying}
                                        className="w-full"
                                        onPlay={() => setIsPlaying(true)}
                                        onPause={() => setIsPlaying(false)}
                                    />

                                    <div className="flex gap-2 pt-2 border-t border-slate-800">
                                        <button
                                            onClick={() => handleDownloadTrack(activeClip)}
                                            className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs shadow-md flex items-center justify-center gap-1.5 cursor-pointer"
                                        >
                                            <Download className="w-4 h-4" />
                                            <span>تنزيل الملف باسمك</span>
                                        </button>

                                        <button
                                            onClick={() => handleDeleteClip(activeClip.id)}
                                            className="p-2.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/40 text-rose-400 border border-rose-500/30 cursor-pointer"
                                            title="حذف"
                                        >
                                            <Trash2 className="w-4 h-4" />
                                        </button>
                                    </div>

                                </div>
                            ) : (
                                <div className="p-10 text-center bg-slate-900 border border-slate-800 rounded-3xl space-y-3">
                                    <Disc className="w-12 h-12 text-slate-600 mx-auto" />
                                    <h3 className="text-sm font-black text-white">لا توجد مقطوعة نشطة حالياً</h3>
                                    <p className="text-xs text-slate-400">اختر نمطك واضغط توليد لإنشاء مقطوعة تحمل اسمك وبصمتك!</p>
                                </div>
                            )}

                            {/* Library */}
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
                                <h3 className="text-xs font-black text-white flex items-center justify-between border-b border-slate-800 pb-2">
                                    <span>مقطوعاتك المولدة ({clipsHistory.length})</span>
                                    <span className="text-[10px] text-amber-400 font-bold">Salh Alheib Klel ✨</span>
                                </h3>

                                {clipsHistory.length === 0 ? (
                                    <p className="text-xs text-slate-500 text-center py-4">المكتبة فارغة.</p>
                                ) : (
                                    <div className="space-y-2.5 max-h-64 overflow-y-auto">
                                        {clipsHistory.map((clip) => (
                                            <div
                                                key={clip.id}
                                                onClick={() => {
                                                    setActiveClip(clip);
                                                    setIsPlaying(true);
                                                }}
                                                className={`p-3 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
                                                    activeClip?.id === clip.id
                                                        ? 'bg-emerald-950/60 border-emerald-500 text-white shadow-lg'
                                                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <img
                                                        src={clip.coverImageUrl}
                                                        alt="cover"
                                                        className="w-10 h-10 rounded-xl object-cover shrink-0"
                                                    />
                                                    <div>
                                                        <h4 className="text-xs font-black text-white line-clamp-1">{clip.title}</h4>
                                                        <span className="text-[10px] text-emerald-400 font-bold">بصمة موثقة (3 دقائق)</span>
                                                    </div>
                                                </div>

                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleDeleteClip(clip.id);
                                                    }}
                                                    className="p-1 text-slate-500 hover:text-rose-400"
                                                >
                                                    <Trash2 className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                        </div>

                    </div>

                </div>
            );
        }

        ReactDOM.render(<Component />, document.getElementById("root"));
    </script>
</body>
</html>
